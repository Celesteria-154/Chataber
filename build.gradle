plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

def mcVersion = providers.gradleProperty('mcVersion').getOrElse('26.2')
def supportedVersions = ['26.1', '26.1.1', '26.1.2', '26.2', '26.3']
if (!supportedVersions.contains(mcVersion)) {
    throw new GradleException("Unsupported mcVersion: ${mcVersion}. Choose: ${supportedVersions.join(', ')}")
}
// 26.1系はパッチ版をまたいで同じ依存設定と画面操作を使う
def profile = mcVersion.startsWith('26.1') ? '26.1.2' : mcVersion
def versionDir = file("versions/${profile}")
def versions = new Properties()
file("${versionDir}/gradle.properties").withInputStream { versions.load(it) }

layout.buildDirectory.set(layout.projectDirectory.dir("build/mc${mcVersion}"))
version = "${project.mod_version}+mc${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            runDir = "run/mc${mcVersion}"
        }
    }

    mods {
        "chataber" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client.java.srcDir("versions/${versions.gui_api_version}/src/client/java")
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Minecraftと各依存の組み合わせは、対象版のgradle.propertiesで管理
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${versions.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${versions.fabric_version}"
    implementation "com.terraformersmc:modmenu:${versions.modmenu_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${versions.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

}

processResources {
    def modMetadata = [
            version: project.version,
            minecraft_range: versions.minecraft_range,
            loader_version: versions.loader_version,
            fabric_version: versions.fabric_version,
            modmenu_version: versions.modmenu_version,
            cloth_config_version: versions.cloth_config_version
    ]
    inputs.properties(modMetadata)
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(modMetadata)
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ソースの文字コードは環境に依存させない
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // 配布JARと併せてソースJARを生成
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Maven公開設定
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}
